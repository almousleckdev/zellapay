name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Pull test images
        run: |
          for image in postgres:17 redis:7 maildev/maildev:2.1.0; do
            for attempt in 1 2 3 4 5; do
              docker pull "$image" && break
              [ "$attempt" = 5 ] && exit 1
              sleep $((attempt * 5))
            done
          done
      - run: ./scripts/check-limits.sh
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./cmd/...
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
