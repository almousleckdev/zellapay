version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - noctx
    - nilerr
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      # TOTP (RFC 6238) is HMAC-SHA1 in every authenticator app, including
      # Google Authenticator, which ignores any other algorithm. HMAC-SHA1 is
      # not weakened by SHA-1 collisions. This is the only exemption, for one
      # rule in one file. See docs/adr/0012-identity-and-access.md.
      - path: internal/platform/totp/totp\.go
        linters: [gosec]
        text: "G505"
  settings:
    funlen:
      lines: 40
      statements: 30
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    revive:
      rules:
        - name: argument-limit
          arguments: [4]
        - name: exported
        - name: unused-parameter
    depguard:
      rules:
        ledger-isolation:
          files:
            - "**/internal/ledger/**"
          deny:
            - pkg: github.com/zellapay/zellapay/internal/collections
              desc: ledger must not depend on other domain modules
            - pkg: github.com/zellapay/zellapay/internal/payouts
              desc: ledger must not depend on other domain modules
            - pkg: github.com/zellapay/zellapay/internal/merchants
              desc: ledger must not depend on other domain modules
            - pkg: net/http
              desc: the domain must not import transport packages
        no-math-rand:
          files:
            - "**/internal/**"
          deny:
            - pkg: math/rand
              desc: use crypto/rand for anything security related

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
