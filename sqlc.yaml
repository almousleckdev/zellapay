version: "2"
sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/ledger
    gen:
      go:
        package: sqlcgen
        out: internal/ledger/pgstore/sqlcgen
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/merchants
    gen:
      go:
        package: sqlcgen
        out: internal/merchants/pgstore/sqlcgen
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/idempotency
    gen:
      go:
        package: sqlcgen
        out: internal/platform/idempotency/pgstore/sqlcgen
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/collections
    gen:
      go:
        package: sqlcgen
        out: internal/collections/pgstore/sqlcgen
        sql_package: pgx/v5
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/webhooks
    gen:
      go:
        package: sqlcgen
        out: internal/webhooks/pgstore/sqlcgen
        sql_package: pgx/v5
