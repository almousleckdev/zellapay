# Local development infrastructure only.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: zellapay
      POSTGRES_PASSWORD: zellapay-local-only
      POSTGRES_DB: zellapay
    ports: ["127.0.0.1:${ZP_PG_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zellapay"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    ports: ["127.0.0.1:${ZP_REDIS_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  maildev:
    # Catches every email the application sends in development. Nothing is
    # delivered to real addresses. Open the inbox at http://localhost:1081.
    image: maildev/maildev:2.1.0
    ports:
      - "127.0.0.1:${ZP_MAILDEV_UI_PORT:-1081}:1080"
      - "127.0.0.1:${ZP_SMTP_PORT:-1026}:1025"
volumes:
  pgdata:
