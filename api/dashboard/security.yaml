enrolment:
  post:
    tags: [Security]
    operationId: beginMfaEnrolment
    summary: Start setting up an authenticator app
    description: Only for a session whose user has not enrolled yet.
    security:
      - sessionAuth: []
    responses:
      '201':
        description: Scan the URI as a QR code, or type the manual key.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Enrolment
      '401':
        $ref: ./responses.yaml#/Unauthorized
      '403':
        $ref: ./responses.yaml#/Forbidden
confirm:
  post:
    tags: [Security]
    operationId: confirmMfaEnrolment
    summary: Finish setup with the first code
    description: |
      Returns ten recovery codes. They are shown only this once, so the
      dashboard must show them in a dialog and never store them.
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/Code
    responses:
      '200':
        description: The second factor is active and this session has proven it.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/RecoveryCodes
      '400':
        $ref: ./responses.yaml#/BadRequest
      '401':
        $ref: ./responses.yaml#/Unauthorized
      '403':
        $ref: ./responses.yaml#/Forbidden
      '422':
        $ref: ./responses.yaml#/InvalidCode
      '429':
        $ref: ./responses.yaml#/TooManyAttempts
sessions:
  get:
    tags: [Security]
    operationId: listSessions
    summary: List your open sessions
    description: Needs a session that has proven the second factor.
    security:
      - sessionAuth: []
    responses:
      '200':
        description: Open sessions, most recently used first.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/SessionList
      '401':
        $ref: ./responses.yaml#/Unauthorized
      '403':
        $ref: ./responses.yaml#/Forbidden
sessionById:
  parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
  delete:
    tags: [Security]
    operationId: endSession
    summary: End one of your sessions
    security:
      - sessionAuth: []
    responses:
      '204':
        description: The session ended.
      '401':
        $ref: ./responses.yaml#/Unauthorized
      '403':
        $ref: ./responses.yaml#/Forbidden
      '404':
        $ref: ./responses.yaml#/NotFound
endOthers:
  post:
    tags: [Security]
    operationId: endOtherSessions
    summary: End every session except this one
    security:
      - sessionAuth: []
    responses:
      '200':
        description: How many sessions ended.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Ended
      '401':
        $ref: ./responses.yaml#/Unauthorized
      '403':
        $ref: ./responses.yaml#/Forbidden
changePassword:
  post:
    tags: [Security]
    operationId: changePassword
    summary: Change your password
    description: |
      Checks the current password (throttled like a sign-in), applies the
      password policy and ends every other session. Needs a recent second
      factor: otherwise `403 step_up_required`, answered by
      `POST /dashboard/session/mfa`.
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ChangePassword
    responses:
      '204':
        description: The password changed and other sessions ended.
      '400':
        $ref: ./responses.yaml#/BadRequest
      '401':
        $ref: ./responses.yaml#/Unauthorized
      '403':
        $ref: ./responses.yaml#/Forbidden
      '422':
        $ref: ./responses.yaml#/WeakPassword
      '429':
        $ref: ./responses.yaml#/TooManyAttempts
regenerateCodes:
  post:
    tags: [Security]
    operationId: regenerateRecoveryCodes
    summary: Replace your recovery codes
    description: |
      The old codes stop working. The new ones are returned once. Needs a
      recent second factor.
    security:
      - sessionAuth: []
    responses:
      '200':
        description: Ten new recovery codes.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/RecoveryCodes
      '401':
        $ref: ./responses.yaml#/Unauthorized
      '403':
        $ref: ./responses.yaml#/Forbidden
removeMfa:
  delete:
    tags: [Security]
    operationId: removeAuthenticator
    summary: Remove your authenticator
    description: |
      Deletes the authenticator and recovery codes and ends every other
      session. This session stays signed in with `mfa: enrol_required`, so
      the user sets up a new authenticator. Needs a recent second factor.
    security:
      - sessionAuth: []
    responses:
      '204':
        description: The authenticator was removed.
      '401':
        $ref: ./responses.yaml#/Unauthorized
      '403':
        $ref: ./responses.yaml#/Forbidden
