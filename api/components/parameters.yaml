IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: |
    A unique value, 1 to 255 printable ASCII characters, such as a UUID.
    Retrying with the same key and body returns the original response.
  schema:
    type: string
    minLength: 1
    maxLength: 255
    pattern: '^[\x21-\x7e]+$'
  example: 7c1f0a52-3b1e-4c53-9d0e-2f6a8a9b1c44
Limit:
  name: limit
  in: query
  description: Maximum number of items to return.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25
StartingAfter:
  name: starting_after
  in: query
  description: Return items after this ID. Use `next_cursor` from a page.
  schema:
    type: string
