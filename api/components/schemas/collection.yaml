CreateCollection:
  type: object
  required: [amount, currency, customer_phone, merchant_reference]
  additionalProperties: false
  properties:
    amount:
      $ref: ./common.yaml#/Amount
    currency:
      $ref: ./common.yaml#/Currency
    customer_phone:
      $ref: ./common.yaml#/Phone
    merchant_reference:
      $ref: ./common.yaml#/MerchantReference
    description:
      type: string
      maxLength: 200
      description: Shown to the customer when the operator supports it.
CollectionStatus:
  type: string
  enum: [pending, succeeded, failed, expired]
  description: |
    `pending` until the customer approves or the operator reports a result.
    `succeeded`, `failed` and `expired` are final. If an operator's result
    is unclear, the collection stays `pending` until it is resolved.
Collection:
  type: object
  required:
    - id
    - status
    - amount
    - currency
    - customer_phone_masked
    - merchant_reference
    - created_at
  properties:
    id:
      type: string
      examples: [col_3f9a1c2e7b4d5a6c8e0f1a2b]
    status:
      $ref: '#/CollectionStatus'
    amount:
      $ref: ./common.yaml#/Amount
    currency:
      $ref: ./common.yaml#/Currency
    fee:
      type: integer
      format: int64
      minimum: 0
      description: Fee charged to you, set when the collection succeeds.
    customer_phone_masked:
      type: string
      description: |
        The customer's number with the middle hidden. ZellaPay does not
        return the full number after the request is accepted.
      examples: ['+241 07 ** ** 56']
    merchant_reference:
      $ref: ./common.yaml#/MerchantReference
    operator:
      $ref: ./common.yaml#/Operator
    failure_code:
      type: [string, 'null']
      description: |
        Why a failed collection failed. One of `customer_declined`,
        `insufficient_customer_funds`, `rejected`, `operator_unavailable`
        or `operator_error`. Unknown values should be treated as a failure.
      examples: [customer_declined, insufficient_customer_funds]
    description:
      type: string
    created_at:
      $ref: ./common.yaml#/Timestamp
    completed_at:
      oneOf:
        - $ref: ./common.yaml#/Timestamp
        - type: 'null'
CollectionList:
  type: object
  required: [data, has_more]
  allOf:
    - $ref: ./common.yaml#/Page
  properties:
    data:
      type: array
      items:
        $ref: '#/Collection'
