CreatePayout:
  type: object
  required: [amount, currency, recipient_phone, merchant_reference]
  additionalProperties: false
  properties:
    amount:
      $ref: ./common.yaml#/Amount
    currency:
      $ref: ./common.yaml#/Currency
    recipient_phone:
      $ref: ./common.yaml#/Phone
    merchant_reference:
      $ref: ./common.yaml#/MerchantReference
    description:
      type: string
      maxLength: 200
PayoutStatus:
  type: string
  enum: [pending, succeeded, failed]
  description: |
    `pending` while funds are held and the operator is processing.
    `succeeded` and `failed` are final. A failed payout releases the held
    funds. An unclear operator result stays `pending` until resolved.
Payout:
  type: object
  required:
    - id
    - status
    - amount
    - currency
    - recipient_phone_masked
    - merchant_reference
    - created_at
  properties:
    id:
      type: string
      examples: [pay_8a1b2c3d4e5f60718293a4b5]
    status:
      $ref: '#/PayoutStatus'
    amount:
      $ref: ./common.yaml#/Amount
    currency:
      $ref: ./common.yaml#/Currency
    fee:
      type: integer
      format: int64
      minimum: 0
      description: Fee charged to you, fixed when the payout is created.
    recipient_phone_masked:
      type: string
      description: The recipient's number with the middle hidden.
      examples: ['+241 07 ** ** 56']
    merchant_reference:
      $ref: ./common.yaml#/MerchantReference
    operator:
      $ref: ./common.yaml#/Operator
    failure_code:
      type: [string, 'null']
      description: |
        Why a failed payout failed. One of `insufficient_funds`, `rejected`,
        `operator_unavailable` or `operator_error`. Treat unknown values as a
        failure.
    description:
      type: string
    created_at:
      $ref: ./common.yaml#/Timestamp
    completed_at:
      oneOf:
        - $ref: ./common.yaml#/Timestamp
        - type: 'null'
CreateBatchPayout:
  type: object
  required: [payouts]
  additionalProperties: false
  properties:
    payouts:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: '#/CreatePayout'
BatchPayoutItem:
  type: object
  required: [index]
  description: |
    The result for one item, in request order. Exactly one of `payout` and
    `error` is present.
  properties:
    index:
      type: integer
      minimum: 0
    payout:
      $ref: '#/Payout'
    error:
      $ref: ./common.yaml#/Error/properties/error
BatchPayoutResult:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        $ref: '#/BatchPayoutItem'
PayoutList:
  type: object
  required: [data, has_more]
  allOf:
    - $ref: ./common.yaml#/Page
  properties:
    data:
      type: array
      items:
        $ref: '#/Payout'
